# 准生产示例：数据落到宿主机独立目录（通常挂在数据盘）
# 使用前：
#   1. 在服务器准备目录并授权，例如：
#        sudo mkdir -p /data/postgres /data/redis
#        sudo chown -R 999:999 /data/postgres   # postgres 官方镜像默认 uid 999
#        sudo chown -R 999:999 /data/redis      # redis 官方 alpine 常用 uid 999
#   2. 复制环境变量：cp .env.prod.example .env.prod 并改成强密码
#   3. 启动：docker compose -f deploy/docker-compose.prod.example.yml --env-file .env.prod up -d
#
# 说明：更常见的线上做法是 Postgres/Redis 用云托管，应用只连连接串。
# 本文件演示「自建单机 Docker + 独立数据目录」时怎么写。

networks:
  backend-net:
    driver: bridge

services:
  postgres-db:
    container_name: postgres-db
    image: postgres:16
    restart: unless-stopped
    # 生产一般不要把 5432 暴露到公网；仅本机或内网访问时再开
    # ports:
    #   - "127.0.0.1:5432:5432"
    volumes:
      # bind mount：数据在宿主机 /data/postgres，不在 Docker 匿名/命名卷里
      - /data/postgres:/var/lib/postgresql/data
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - backend-net

  redis-cache:
    container_name: redis-cache
    image: redis:7-alpine
    restart: unless-stopped
    # ports:
    #   - "127.0.0.1:6379:6379"
    volumes:
      - /data/redis:/data
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --requirepass
      - ${REDIS_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a ${REDIS_PASSWORD} ping | grep PONG"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - backend-net
