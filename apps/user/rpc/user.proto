syntax = "proto3";

package user;

option go_package = "github.com/rechardlc/go-im-chat/apps/user/rpc/user";

// Sex 性别
enum Sex {
  SEX_UNSPECIFIED = 0;
  SEX_UNKNOWN = 1;
  SEX_MALE = 2;
  SEX_FEMALE = 3;
}

// UserStatus 账号状态
enum UserStatus {
  USER_STATUS_UNSPECIFIED = 0;
  USER_STATUS_ACTIVE = 1;
  USER_STATUS_DISABLED = 2;
}

// UserEntity 用户公开资料（不含 password）
message UserEntity {
  string id = 1;
  string avatar = 2;
  string nickname = 3;
  string phone = 4;
  UserStatus status = 5;
  Sex sex = 6;
}

message Request {
  string ping = 1;
}

message Response {
  string pong = 1;
}

message LoginReq {
  string phone = 1;
  string password = 2;
}

message LoginResp {
  string token = 1;
  int64 expire = 2; // token 有效期（秒）
  UserEntity user = 3;
}

message RegisterReq {
  string phone = 1;
  string password = 2;
  string nickname = 3;
  string avatar = 4;
  Sex sex = 5;
}

message RegisterResp {
  string token = 1;
  int64 expire = 2; // token 有效期（秒）
  UserEntity user = 3;
}

message GetUserInfoReq {
  string id = 1;
}

message GetUserInfoResp {
  UserEntity user = 1;
}

message FindUserReq {
  string name = 1;
  string phone = 2;
  repeated string ids = 3;
}

message FindUserResp {
  repeated UserEntity users = 1;
}

message UpdateUserInfoReq {
  string id = 1;
  string nickname = 2;
  string avatar = 3;
  Sex sex = 4;
}

message UpdateUserInfoResp {
  UserEntity user = 1;
}

service User {
  rpc Ping(Request) returns (Response);
  rpc Login(LoginReq) returns (LoginResp);
  rpc Register(RegisterReq) returns (RegisterResp);
  rpc GetUserInfo(GetUserInfoReq) returns (GetUserInfoResp);
  rpc FindUser(FindUserReq) returns (FindUserResp);
  rpc UpdateUserInfo(UpdateUserInfoReq) returns (UpdateUserInfoResp);
}
