Name: user.rpc
ListenOn: ${HOST}:8080
Etcd:
  Hosts:
  - ${ETCD_HOSTS}
  Key: user.rpc

Postgres:
  DataSource: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@${HOST}:5432/${POSTGRES_DB}?sslmode=disable

CacheRedis:
  - Host: ${HOST}:6379
    Pass: ${REDIS_PASSWORD}
    Type: node

JWT:
  Secret: ${JWT_SECRET}
  AccessTokenExpire: ${JWT_ACCESS_TOKEN_EXPIRE}
  RefreshTokenExpire: ${JWT_REFRESH_TOKEN_EXPIRE}

